<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar ou Criar Conta - OnlyFungos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo"><a href="index.html" style="color: var(--primary-color);">OnlyFungos 🦶</a></div>
        </nav>
    </header>

    <main>
        <div class="login-container">
            <div class="login-form">
                <h2>Criar Conta</h2>
                <form>
                    <div class="form-group">
                        <label for="name">Nome</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit">Criar Conta</button>
                </form>
                <p class="toggle-form">Já tem uma conta? <a href="#">Entrar</a></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="#">Sobre</a>
            <a href="#">Termos de Uso</a>
            <a href="#">Contato</a>
        </div>
        <p>&copy; 2024 OnlyFungos. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
