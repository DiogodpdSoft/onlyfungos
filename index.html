<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyFungos - Onde cada pé tem sua própria estrela 🌟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">OnlyFungos 🦶</div>
            <div class="auth-buttons">
                <a href="login.html"><button class="login-btn">Entrar</button></a>
                <a href="login.html"><button class="signup-btn">Criar Conta</button></a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Onde cada pé tem sua própria estrela 🌟</h1>
            <p>Descubra os pés mais criativos e divertidos da internet.</p>
            <a href="#popular-profiles"><button class="explore-btn">Explorar Perfis</button></a>
        </section>

        <section id="popular-profiles" class="popular-profiles">
            <h2>Perfis Populares</h2>
            <div class="profile-cards">
                <div class="card">
                    <img src="assets/profile1.jpg" alt="Foto de perfil de PezinhoAlegre">
                    <h3>PezinhoAlegre</h3>
                    <a href="profile.html"><button>Ver Perfil</button></a>
                </div>
                <div class="card">
                    <img src="assets/profile2.jpg" alt="Foto de perfil de DedoDivertido">
                    <h3>DedoDivertido</h3>
                    <a href="profile.html"><button>Ver Perfil</button></a>
                </div>
                <div class="card">
                    <img src="assets/profile3.jpg" alt="Foto de perfil de CalcanharComico">
                    <h3>CalcanharComico</h3>
                    <a href="profile.html"><button>Ver Perfil</button></a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-links">
            <a href="#">Sobre</a>
            <a href="#">Termos de Uso</a>
            <a href="#">Contato</a>
        </div>
        <p>&copy; 2024 OnlyFungos. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
